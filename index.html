
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашнее задание JavaScript</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <h1>Домашнее задание JavaScript</h1>

    <section>
        <h2>Задание 4. Таймер обратного отсчёта</h2>
        <p id="timer">10</p>
        <button id="startTimer">Start</button>
        <button id="stopTimer">Stop</button>
        <button id="resetTimer">Reset</button>
    </section>

    <section>
        <h2>Задание 5. Изменение цвета блока</h2>
        <div id="colorBox"></div>
        <button id="colorButton">Изменить цвет</button>
    </section>

    <section>
        <h2>Задание 7. Поиск пользователя</h2>
        <input type="text" id="loginInput" placeholder="Введите логин">
        <button id="checkBtn">Проверить</button>
        <div id="userCard"></div>
        <p id="message"></p>
    </section>
</body>
</html>
